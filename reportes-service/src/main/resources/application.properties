spring.application.name=reportes-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/pagoflex_reportes?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.web.error.include-message=always
server.forward-headers-strategy=framework

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

compromisos.service.url=http://compromisos-service
usuarios.service.url=http://usuarios-service

app.fotos.carpeta=uploads/reportes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
