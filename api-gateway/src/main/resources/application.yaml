server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          trusted-proxies: ".*"
          routes:
            - id: usuarios
              uri: lb://usuarios-service
              predicates:
                - Path=/api/usuarios,/api/usuarios/**
            - id: empresas
              uri: lb://compromisos-service
              predicates:
                - Path=/api/empresas,/api/empresas/**
            - id: compromisos
              uri: lb://compromisos-service
              predicates:
                - Path=/api/compromisos,/api/compromisos/**
            - id: pagos
              uri: lb://pagos-service
              predicates:
                - Path=/api/pagos,/api/pagos/**
            - id: reportes
              uri: lb://reportes-service
              predicates:
                - Path=/api/reportes,/api/reportes/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    hostname: localhost
    prefer-ip-address: false
